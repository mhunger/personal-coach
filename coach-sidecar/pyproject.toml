[project]
name = "personal-coach-sidecar"
version = "0.1.0"
description = "Personal Coach AI sidecar — Claude Agent SDK + FastAPI."
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.1.63",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coach"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
